<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoQuiz</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

    <nav>
        <div class="logo">
            GeoQuiz
        </div>

        <div class="nav-links">
            <!-- <a href="#">How to Play</a>
            <a href="#">About</a> -->
        </div>
    </nav>


    <main class="hero">

        <section id="game" class="game">

            <div id="round-title">
                Guess the country
            </div>
                            
            <div class="country-selector">
                <!-- For publication, style="display: none;". remove for testing -->
                <label for="country-select" style="display: none;">
                    Test a country:
                </label>

                <select id="country-select" style="display: none;">
                    <option value="">
                        Select a country
                    </option>
                </select>
                
                <div class="mode-selector">
                
                    <button type="button" class="mode-option" id="easy-mode-button">
                        Easy
                    </button>
                
                    <button type="button" class="mode-option active" id="hard-mode-button">
                        Hard
                    </button>
                
                </div>

            </div>


            <div class="map-section">
            
                <div id="map"></div>
            
                <div id="flag-area"></div>

                <div id="hint-area">
                
                    <h3 id="hint-title">Hints</h3>
                
                    <p id="hint-remaining">
                        Hints remaining: 3
                    </p>
                
                    <ol id="hint-list"></ol>
                
                    <button id="hint-button">
                        Need a hint?
                    </button>
                
                </div>
            
            </div>


            <div class="game-content">

                <!-- LEFT SIDE: GUESSING -->
                <div class="guess-area">
                    <p id="message"></p>

                    <div class="guess-controls">
                    
                        <div class="guess-input-wrapper">
                    
                            <input type="text" id="guess-input" placeholder="Select country" autocomplete="off">
                    
                            <div id="autocomplete-list"></div>
                    
                        </div>
                    
                        <button id="guess-button">
                            Submit
                        </button>
                    
                    </div>



                    <div class="secondary-controls">

                        <button id="give-up-button">
                            Give Up
                        </button>

                        <button id="new-country-button">
                            New Country
                        </button>

                        <button id="continue-button">
                            Continue On →
                        </button>

                    </div>


                    <button id="explore-button">
                        Explore
                        <span id="explore-country-name"></span>
                    </button>


                    <div id="country-info" style="display: none;">

                        <img id="country-flag" alt="Country flag">

                        <h2 id="country-info-name"></h2>

                        <p>
                            <strong>Official name:</strong>
                            <span id="country-official-name"></span>
                        </p>

                        <p>
                            <strong>Capital:</strong>
                            <span id="country-capital"></span>
                        </p>

                        <p>
                            <strong>Continent:</strong>
                            <span id="country-continent"></span>
                        </p>

                        <p>
                            <strong>Subregion:</strong>
                            <span id="country-subregion"></span>
                        </p>

                        <p>
                            <strong>Population:</strong>
                            <span id="country-population"></span>
                        </p>

                        <p>
                            <strong>Area:</strong>
                            <span id="country-area"></span> km²
                        </p>

                        <p>
                            <strong>Currency:</strong>
                            <span id="country-currency"></span>
                        </p>

                        <p>
                            <strong>Languages:</strong>
                            <span id="country-languages"></span>
                        </p>

                        <p>
                            <strong>Neighbors:</strong>
                            <span id="country-neighbors"></span>
                        </p>

                        <p>
                            <strong>Landlocked:</strong>
                            <span id="country-landlocked"></span>
                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!--
        <div class="features">

            <div class="feature">
                <h3>Identify</h3>
                <p>
                    Recognize countries from their borders.
                </p>
            </div>

            <div class="feature">
                <h3>Explore</h3>
                <p>
                    Travel from country to country through neighboring borders.
                </p>
            </div>

            <div class="feature">
                <h3>Challenge</h3>
                <p>
                    Test your geography knowledge and improve your score.
                </p>
            </div>

        </div>
        -->

    </main>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="game.js"></script>

</body>

</html>
